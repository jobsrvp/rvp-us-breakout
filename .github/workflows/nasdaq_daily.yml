name: Daily NASDAQ Breadth & RS

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-nasdaq-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install TA-Lib C Library
      uses: TA-Lib/setup-ta-lib@v1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy matplotlib requests plotly TA-Lib

    - name: Run NASDAQ Data Pipeline
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "Generating Relative Strength data..."
        python generate_nasdaq_rs.py
        
        echo "Calculating Market Breadth..."
        python market_breadth_nasdaq.py
        
        echo "Plotting and broadcasting charts..."
        python breadth_plotter_nasdaq.py
