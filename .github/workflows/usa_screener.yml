name: Tri-Weekly US Stock Screener

on:
  schedule:
    # Runs at 15:00 UTC (10:00 AM EST) on Wednesday (3), Friday (5), and Saturday (6)
    - cron: '0 15 * * 3,5,6'
  workflow_dispatch: 

# Grants workflow write permissions to push JSON cache updates back to the repo
permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install TA-Lib C Library
      uses: TA-Lib/setup-ta-lib@v1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy matplotlib requests plotly TA-Lib

    - name: Run US Stock Screener
      env:
        # Fixed: Changed key name to TELEGRAM_TOKEN so os.getenv('TELEGRAM_TOKEN') in Python catches it
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "Running USA Market Screener..."
        python screenerUSA.py

    - name: Commit and Push Updated JSON Caches
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rs_rating_cache.json rs_rating_history.json metadata_cache.json
        # Only commits if JSON changes were actually detected
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RS rating and metadata JSON cache [skip ci]" && git push)
